# VOXEL PACS — OHIF compartilhado com DICOMweb tenant-scoped.
# Nenhum destino Orthanc ou credencial é exposto ao navegador.
server {
    listen 80;
    server_name view.voxelpacs.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name view.voxelpacs.com.br;
    ssl_certificate     /etc/letsencrypt/live/view.voxelpacs.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/view.voxelpacs.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Formato sem query-string para não registrar StudyInstanceUIDs.
    access_log /opt/voxelpacs/logs/view-access.log voxel_tenant;
    error_log  /opt/voxelpacs/logs/view-error.log warn;

    location = /health { access_log off; return 200 "OK\n"; add_header Content-Type text/plain; }
    location = / { return 302 https://server.voxelpacs.com.br/estudos; }
    location = /studylist { return 302 https://server.voxelpacs.com.br/estudos; }

    location = /_voxel_shared_viewer_auth {
        internal;
        proxy_pass https://10.0.0.2/internal/viewer-auth/shared;
        proxy_ssl_server_name on;
        proxy_ssl_name server.voxelpacs.com.br;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/voxelpacs-api-chain.pem;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Voxel-Viewer-Origin https://view.voxelpacs.com.br;
        proxy_set_header Host server.voxelpacs.com.br;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /app-config.js {
        auth_request /_voxel_shared_viewer_auth;
        error_page 401 = @viewer_unauthorized;
        error_page 403 = @viewer_forbidden;
        error_page 503 = @viewer_unavailable;
        proxy_pass http://127.0.0.1:3000/app-config.js;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /viewer { return 302 /viewer/dicomweb$is_args$args; }

    location /dicom-web/ {
        auth_request /_voxel_shared_viewer_auth;
        auth_request_set $voxel_orthanc_upstream $upstream_http_x_voxel_dicomweb_upstream;
        auth_request_set $voxel_orthanc_authorization $upstream_http_x_voxel_dicomweb_authorization;
        error_page 401 = @viewer_unauthorized;
        error_page 403 = @viewer_forbidden;
        error_page 503 = @viewer_unavailable;
        proxy_pass $voxel_orthanc_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $voxel_orthanc_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        auth_request /_voxel_shared_viewer_auth;
        error_page 401 = @viewer_unauthorized;
        error_page 403 = @viewer_forbidden;
        error_page 503 = @viewer_unavailable;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location @viewer_unauthorized { return 401; }
    location @viewer_forbidden { return 403; }
    location @viewer_unavailable { return 503; }
}
