# =============================================================================
# VOXEL PACS — VirtualHost OHIF Viewer (VOXEL VIEW)
# Domínio: view.voxelpacs.com.br → OHIF (127.0.0.1:3000)
# Segurança LGPD: acesso direto bloqueado, apenas via token do servidor PHP
# =============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name view.voxelpacs.com.br;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — OHIF Viewer (VOXEL VIEW)
server {
    listen 443 ssl;
    server_name view.voxelpacs.com.br;
    ssl_certificate     /etc/letsencrypt/live/view.voxelpacs.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/view.voxelpacs.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Logs
    access_log /opt/voxelpacs/logs/view-access.log;
    error_log  /opt/voxelpacs/logs/view-error.log;

    # =========================================================================
    # LGPD — Bloqueio de acesso direto ao Study List
    # Acesso à raiz / redireciona para o sistema PHP (worklist autenticada)
    # =========================================================================
    location = / {
        return 302 https://server.voxelpacs.com.br/estudos;
    }

    # Bloquear acesso direto ao Study List do OHIF
    location = /studylist {
        return 302 https://server.voxelpacs.com.br/estudos;
    }

    # =========================================================================
    # Configuração dinâmica do OHIF — nunca reutilizar versão desatualizada.
    # O query-string abaixo invalida o cache existente do service worker uma vez.
    # =========================================================================
    location = /app-config.js {
        proxy_pass         http://127.0.0.1:3000/app-config.js;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # =========================================================================
    # OHIF SPA — proxy reverso
    # Permite apenas /viewer (com StudyInstanceUIDs), /open, assets estáticos.
    # Reescreve somente a referência da configuração para quebrar cache antigo.
    # =========================================================================
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Accept-Encoding   "";
        proxy_read_timeout 300s;

        sub_filter_once off;
        sub_filter 'src="/app-config.js"' 'src="/app-config.js?v=voxel-branding-20260813"';
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
