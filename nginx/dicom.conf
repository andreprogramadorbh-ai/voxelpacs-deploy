# =============================================================================
# VOXEL PACS — VirtualHost DICOMweb
# Domínio: dicom.voxelpacs.com.br → Proxy Python porta 8043
#
# CORS: restrito a https://view.voxelpacs.com.br (condicional via $cors_origin)
# O proxy Python (dicom_proxy.py) corrige o Content-Type multipart do Orthanc
# removendo as aspas do type= para compatibilidade com Cornerstone3D/OHIF
# =============================================================================

# Mapa CORS: só responde com o header para a origem legítima
map $http_origin $cors_origin {
    default                          "";
    "https://view.voxelpacs.com.br"  "https://view.voxelpacs.com.br";
}

server {
    listen 80;
    server_name dicom.voxelpacs.com.br;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dicom.voxelpacs.com.br;

    ssl_certificate     /etc/letsencrypt/live/dicom.voxelpacs.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dicom.voxelpacs.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /opt/voxelpacs/logs/dicom-access.log;
    error_log  /opt/voxelpacs/logs/dicom-error.log;

    # =========================================================================
    # DICOMweb — via proxy Python (porta 8043) que corrige Content-Type
    # CORS condicional: só view.voxelpacs.com.br recebe o header
    # =========================================================================
    location /dicom-web/ {
        # Preflight OPTIONS — responder apenas para origem legítima
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$cors_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Max-Age       3600 always;
            return 204;
        }

        proxy_pass         http://127.0.0.1:8043/dicom-web/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 2G;

        # CORS condicional — vazio para origens não autorizadas
        add_header Access-Control-Allow-Origin   "$cors_origin" always;
        add_header Access-Control-Allow-Methods  "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers  "Authorization, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    }

    # =========================================================================
    # WADO-URI — direto no Orthanc
    # =========================================================================
    location /wado {
        # Preflight OPTIONS
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$cors_origin" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            return 204;
        }

        proxy_pass         http://127.0.0.1:8042/wado;
        proxy_set_header   Authorization "Basic dml2ZXJlX2FkbWluOklubGF1ZG8yNTkwODdA";
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;

        add_header Access-Control-Allow-Origin  "$cors_origin" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
    }

    # =========================================================================
    # Orthanc REST API direta (sem DICOMweb)
    # =========================================================================
    location / {
        # Preflight OPTIONS
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$cors_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            return 204;
        }

        proxy_pass         http://127.0.0.1:8042;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 2G;

        add_header Access-Control-Allow-Origin  "$cors_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
    }

    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
