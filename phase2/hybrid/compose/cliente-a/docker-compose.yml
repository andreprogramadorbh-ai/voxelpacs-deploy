services:
  postgres:
    image: postgres:16.9-bookworm
    container_name: voxelpacs-cliente-a-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - ${TENANT_DATA_ROOT}/postgres:/var/lib/postgresql/data
    networks:
      - cliente-a-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "7"

  orthanc:
    image: voxelpacs/orthanc-cliente-a:25.12.3-1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voxelpacs-cliente-a-orthanc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      POSTGRESQL_PLUGIN_ENABLED: "true"
      GENERATE_HOST_ID_IF_MISSING: "false"
    volumes:
      - ${TENANT_CONFIG_ROOT}/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ${TENANT_CONFIG_ROOT}/postgresql.json:/etc/orthanc/postgresql.json:ro
      - ${TENANT_CONFIG_ROOT}/credentials.json:/etc/orthanc/credentials.json:ro
      - ${TENANT_DATA_ROOT}/dicom:/var/lib/orthanc/db
    networks:
      - cliente-a-internal
      - cliente-a-ingress
    ports:
      - "${HOST_PRIVATE_IP}:${DICOM_PORT}:4242/tcp"
      - "${HOST_PRIVATE_IP}:${DICOMWEB_PORT}:8042/tcp"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1', 8042), 5); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: 50m
        max-file: "7"

networks:
  cliente-a-internal:
    driver: bridge
    internal: true
  cliente-a-ingress:
    driver: bridge
