services:
  ohif:
    image: ohif/app:v3.12.5
    container_name: voxelpacs-cliente-a-ohif
    restart: unless-stopped
    # A imagem oficial ajusta o app-config e o default.conf durante o entrypoint.
    # O filesystem permanece efêmero no overlay do container; nenhum volume host é gravável.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./app-config.js:/usr/share/nginx/html/app-config.js:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
