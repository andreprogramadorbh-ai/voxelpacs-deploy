services:
  postgres:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-30}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
    volumes:
      - ${TENANT_DATA_ROOT:?Defina TENANT_DATA_ROOT}/postgres:/var/lib/postgresql/data
    networks:
      - tenant-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-0.50}
          memory: ${POSTGRES_MEMORY_LIMIT:-512M}
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "7"

  orthanc:
    image: voxelpacs/orthanc-tenant:25.12.3-1
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      POSTGRESQL_PLUGIN_ENABLED: "true"
      GENERATE_HOST_ID_IF_MISSING: "false"
    volumes:
      - ${TENANT_CONFIG_ROOT:?Defina TENANT_CONFIG_ROOT}/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ${TENANT_CONFIG_ROOT}/postgresql.json:/etc/orthanc/postgresql.json:ro
      - ${TENANT_CONFIG_ROOT}/credentials.json:/etc/orthanc/credentials.json:ro
      - ${TENANT_DATA_ROOT}/dicom:/var/lib/orthanc/db
    networks:
      - tenant-internal
      - tenant-ingress
    ports:
      - "${HOST_PRIVATE_IP:?Defina HOST_PRIVATE_IP}:${DICOM_PORT:?Defina DICOM_PORT}:4242/tcp"
      - "${HOST_PRIVATE_IP}:${DICOMWEB_PORT:?Defina DICOMWEB_PORT}:8042/tcp"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1', 8042), 5); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: ${ORTHANC_CPU_LIMIT:-1.00}
          memory: ${ORTHANC_MEMORY_LIMIT:-1024M}
    logging:
      driver: local
      options:
        max-size: 50m
        max-file: "7"

networks:
  tenant-internal:
    driver: bridge
    internal: true
  tenant-ingress:
    driver: bridge
