# /etc/wireguard/wg0.conf — gateway-dicom-01
# Arquivo root-only (0600). Preencher chaves no host, nunca no Git.
[Interface]
Address = 10.200.10.1/24
ListenPort = 51820
PrivateKey = __GATEWAY_WIREGUARD_PRIVATE_KEY__
SaveConfig = false

# Cliente A / Philips-Inova. Uma chave e IP VPN exclusivos por emissor.
[Peer]
PublicKey = __CLIENTE_A_WIREGUARD_PUBLIC_KEY__
AllowedIPs = 10.200.10.2/32
PersistentKeepalive = 25
